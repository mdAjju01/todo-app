<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#003135">
  <meta name="description" content="A simple personal productivity app">
  <link rel="manifest" href="manifest.json">

  <title>Todo</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="brand">
        <div class="brand-mark">✓</div>
        <span>todo</span>
      </div>

      <nav class="navigation">

        <button class="nav-item active" data-view="today">
          <span class="nav-icon">○</span>
          <span>Today</span>
          <span class="nav-count" id="todayCount">0</span>
        </button>

        <button class="nav-item" data-view="upcoming">
          <span class="nav-icon">◷</span>
          <span>Upcoming</span>
          <span class="nav-count" id="upcomingCount">0</span>
        </button>

        <button class="nav-item" data-view="completed">
          <span class="nav-icon">✓</span>
          <span>Completed</span>
          <span class="nav-count" id="completedCount">0</span>
        </button>

      </nav>

      <div class="sidebar-bottom">

        <button class="nav-item" id="themeToggle">
          <span class="nav-icon" id="themeIcon">☾</span>
          <span>Appearance</span>
        </button>

      </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

      <!-- MOBILE HEADER -->
      <header class="mobile-header">

        <div class="brand">
          <div class="brand-mark">✓</div>
          <span>todo</span>
        </div>

        <button class="mobile-menu" id="mobileMenu">
          ☰
        </button>
        <header class="mobile-header">

  <div class="brand">
    <div class="brand-mark">✓</div>
    <span>todo</span>
  </div>

  <button class="mobile-menu" id="mobileMenu">
    ☰
  </button>

  <div class="mobile-nav" id="mobileNav">

    <button class="mobile-nav-item active" data-view="today">
      <span>○</span>
      <span>Today</span>
    </button>

    <button class="mobile-nav-item" data-view="upcoming">
      <span>◷</span>
      <span>Upcoming</span>
    </button>

    <button class="mobile-nav-item" data-view="completed">
      <span>✓</span>
      <span>Completed</span>
    </button>

    <button class="mobile-nav-item" id="mobileThemeToggle">
      <span>☾</span>
      <span>Appearance</span>
    </button>

  </div>

</header>

      </header>


      <!-- TOP BAR -->
      <header class="topbar">

        <div class="heading">

          <p class="eyebrow" id="pageEyebrow">MY DAY</p>

          <h1 id="pageTitle">Today</h1>

          <p class="date-text" id="pageDate"></p>

        </div>

        <div class="topbar-actions">

  <button
    class="voice-task-button"
    id="voiceTaskButton"
    title="Add task by voice"
    aria-label="Add task by voice"
  >
    <span>🎙</span>
  </button>

  <button
    class="add-task-button"
    id="openTaskModal"
  >
    <span>+</span>
    Add task
  </button>
     </div>
      </header>


      <!-- SEARCH -->
      <div class="search-wrapper">

        <span class="search-icon">⌕</span>

        <input
          type="search"
          id="searchInput"
          placeholder="Search tasks..."
          autocomplete="off"
        >

        <kbd>⌘ K</kbd>

      </div>


      <!-- TASK AREA -->
      <section class="task-section">

        <div class="section-header">

          <div>
            <span class="section-title" id="sectionTitle">
              Today's tasks
            </span>

            <span class="task-total" id="taskTotal">
              0
            </span>
          </div>

        </div>


        <div class="task-list" id="taskList">

          <!-- Tasks generated by JavaScript -->

        </div>


        <!-- EMPTY STATE -->
        <div class="empty-state" id="emptyState">

          <div class="empty-illustration">
            <span>✓</span>
          </div>

          <h2 id="emptyTitle">
            Your day is clear
          </h2>

          <p id="emptyText">
            Add something you want to get done today.
          </p>

          <button
            class="empty-add-button"
            id="emptyAddButton"
          >
            Add your first task
          </button>

        </div>

      </section>

    </main>

  </div>


  <!-- MODAL -->
  <div
    class="modal-overlay"
    id="taskModal"
    aria-hidden="true"
  >

    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >

      <div class="modal-header">

        <div>
          <p class="eyebrow">TASK</p>
          <h2 id="modalTitle">Add a task</h2>
        </div>

        <button
          class="close-button"
          id="closeTaskModal"
          aria-label="Close"
        >
          ×
        </button>

      </div>


      <form id="taskForm">

        <div class="form-group">

          <label for="taskTitle">
            What needs to be done?
          </label>

          <input
            id="taskTitle"
            type="text"
            placeholder="e.g. Finish assignment"
            autocomplete="off"
            required
          >

        </div>


        <div class="form-row">

          <div class="form-group">

            <label for="taskDate">
              Date
            </label>

            <input
              id="taskDate"
              type="date"
            >

          </div>


          <div class="form-group">

            <label for="taskPriority">
              Priority
            </label>

            <select id="taskPriority">

              <option value="low">
                Low
              </option>

              <option value="medium" selected>
                Medium
              </option>

              <option value="high">
                High
              </option>

            </select>

          </div>

        </div>


        <div class="form-group">

          <label for="taskNotes">
            Notes
          </label>

          <textarea
            id="taskNotes"
            placeholder="Anything else you want to remember..."
            rows="3"
          ></textarea>

        </div>


        <div class="modal-actions">

          <button
            type="button"
            class="cancel-button"
            id="cancelTask"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="create-task-button"
          >
            <span id="submitTaskText">Create task</span>
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- TOAST -->
  <div class="toast" id="toast">
    <span id="toastMessage"></span>
  </div>


  <script src="app.js"></script>

</body>
</html>
